apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: teamdigihot
  name: hotpot
  namespace: teamdigihot
spec:
  image: {{ image }}
  port: 8080
  ingresses:
    - https://hotpot.intern.dev.nav.no
  liveness:
    path: /isalive
  readiness:
    path: /isready
  prometheus:
    enabled: true
    path: /metrics
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      cpu: 500m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 512Mi
  azure:
    application:
      enabled: true
      allowAllUsers: false
      claims:
        extra:
          - "NAVident"
        groups:
          - id: "b9340050-ccb5-4de7-9d96-0fb2d9fb38eb" # 0000-GA-hotsak-brukere
  tokenx:
    enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: hjelpemidler-api
          namespace: team-oebs
        - application: logging
          namespace: nais-system
        - application: azure-token-generator
          namespace: nais
          cluster: dev-gcp
        - application: tokenx-token-generator
          namespace: nais
          cluster: dev-gcp
  env:
    - name: HTTP_PORT
      value: "8080"
    - name: HJELPEMIDLER_API_BASE_URL
      value: https://hjelpemidler-api.intern.dev.nav.no/api/v1
    - name: HJELPEMIDLER_API_TARGET
      value: dev-gcp:team-oebs:hjelpemidler-api
